<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LeanStreak - A low-friction habit and calorie consistency tracker">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LeanStreak">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>

  <title>LeanStreak</title>
  <meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171513" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <style>
    /* Match the app's warm background so there is no white flash on load. */
    html, body { margin: 0; background: #F6F4EF; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #171513; }
      #loading { color: #B3ACA3; }
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6E6A63;
      font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif;
    }
  </style>
</head>
<body>
  <div id="loading">LeanStreak</div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Local runs use an App Check debug token (register it in the console).
    if (['localhost', '127.0.0.1'].includes(location.hostname)) {
      self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
