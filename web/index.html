<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="YumSum - A low-friction habit and calorie consistency tracker">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="YumSum">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>

  <title>YumSum</title>
  <meta name="theme-color" content="#FBF0E4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A1512" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <!-- The app's code is the big download; start it before the loader runs. -->
  <link rel="preload" href="main.dart.js" as="script">
  <!-- Firebase's modules, which FlutterFire only starts fetching once
       main.dart.js has run; the version must be FlutterFire's, which
       tools/build_hosting.ps1 checks. Then the servers a signed-in start
       talks to first. -->
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore-pipelines.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-functions.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/13.1.0/firebase-app-check.js">
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <style>
    /* The same splash the app draws first (SplashScreen, AppLogoMark), so
       nothing changes when it takes over; the app's fonts, which it will
       fetch again from the browser's cache. */
    @font-face {
      font-family: Fredoka;
      font-weight: 600;
      font-display: swap;
      src: url(assets/assets/fonts/Fredoka-SemiBold.ttf);
    }
    @font-face {
      font-family: Nunito;
      font-weight: 600;
      font-display: swap;
      src: url(assets/assets/fonts/Nunito-SemiBold.ttf);
    }
    html, body { margin: 0; background: #FBF0E4; }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #2B1F18;
      font: 600 15px Nunito, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #loading .tile {
      width: 96px;
      height: 96px;
      padding: 13px;
      box-sizing: border-box;
      border-radius: 27px;
      background: linear-gradient(135deg, #E08A45, #D2402C);
      box-shadow: 0 12px 30px rgba(201, 77, 26, 0.3);
    }
    #loading .tile svg { display: block; width: 100%; height: 100%; }
    #loading .name {
      margin-top: 20px;
      font: 600 38px Fredoka, Nunito, system-ui, sans-serif;
    }
    #loading .tagline { margin-top: 6px; color: #6F5F53; }
    #loading .spinner {
      margin-top: 32px;
      width: 24px;
      height: 24px;
      box-sizing: border-box;
      border: 2.5px solid rgba(201, 77, 26, 0.2);
      border-top-color: #C94D1A;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      html, body { background: #1A1512; }
      #loading { color: #F6EDE3; }
      #loading .tagline { color: #BCAD9F; }
      #loading .spinner {
        border-color: rgba(245, 138, 90, 0.2);
        border-top-color: #F58A5A;
      }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="tile">
      <!-- The bowl from AppLogoMark's painter, in its coordinates. -->
      <svg viewBox="205 205 614 614" aria-hidden="true">
        <defs>
          <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="231" x2="0" y2="791">
            <stop offset="0" stop-color="#7BE8A1"/><stop offset="1" stop-color="#38CFA3"/>
          </linearGradient>
          <linearGradient id="p" gradientUnits="userSpaceOnUse" x1="0" y1="231" x2="0" y2="791">
            <stop offset="0" stop-color="#FBE9CF"/><stop offset="1" stop-color="#FBBA88"/>

          <linearGradient id="b" gradientUnits="userSpaceOnUse" x1="0" y1="548" x2="0" y2="792">
            <stop offset="0" stop-color="#FCEBD3"/><stop offset="1" stop-color="#F9D9B6"/>
          </linearGradient>
        </defs>
        <g fill="none" stroke-width="53" stroke-linecap="round">
          <path d="M512 231A280 280 0 0 1 788.8 553.4" stroke="url(#g)"/>

        <path d="M512 345V390M605 382L582 413" fill="none" stroke="#FBE4C5" stroke-width="22" stroke-linecap="round"/>
        <ellipse cx="512" cy="570" rx="230" ry="22" fill="#FCF3E2"/>
        <path d="M505 590Q580 428 405 392Q330 554 505 590Z" fill="#1B6A32"/>
        <path d="M520 590Q602 537 548 455Q466 508 520 590Z" fill="#2F7F3F"/>

        <rect x="404" y="765" width="216" height="52" rx="26" fill="#F8CFA6"/>
        <path d="M282 570A230 22 0 0 1 742 570C742 690 630 792 512 792C394 792 282 690 282 570Z" fill="url(#b)"/>
        <path d="M742 570A230 22 0 0 1 282 570" fill="none" stroke="#FCF3E2" stroke-width="14" stroke-linecap="round"/>
        <g fill="none" stroke="#A23419" stroke-width="19" stroke-linecap="round">
          <path d="M385.3 669.4A33 33 0 0 1 450.7 669.4"/>

    </div>
    <div class="name">YumSum</div>
    <div class="tagline">Stay consistent. Stay lean.</div>
    <div class="spinner"></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Local runs use an App Check debug token (register it in the console).
    if (['localhost', '127.0.0.1'].includes(location.hostname)) {
      self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
    }
  </script>
  <script>
    // FlutterFire puts each Firebase module on window (firebase_auth,
    // firebase_app_check, ...) as it loads it; these hooks adjust two as
    // they arrive. The names used are Firebase's own, checked in JS SDK
    // 13.1.0 (tools/build_hosting.ps1 stops when FlutterFire moves on); if
    // they change, Firebase's usual behaviour is kept.
    (function () {
      function onModule(name, adjust) {
        let module;
        Object.defineProperty(window, name, {
          configurable: true,
          get: () => module,
          set(value) {
            try {
              module = adjust(value) || value;
            } catch (error) {
              module = value;
            }
          },
        });
      }

      // On phones and in Safari, Firebase Auth waits at start-up for
      // Google's pop-up helper (a script from apis.google.com and a frame
      // from firebaseapp.com) before it says who is signed in, with no time
      // limit: when the helper is slow the app sits on its logo (7 November,
      // iPhones). Auth starts without it here and loads it straight after,
      // so the Google sign-in pop-up is still ready by the time someone taps.
      onModule('firebase_auth', withHelperAfterStart);

      function withHelperAfterStart(module) {
        const resolver = module && module.browserPopupRedirectResolver;
        const proto = resolver && resolver.prototype;
        if (
          !proto ||
          !('_shouldInitProactively' in proto) ||
          typeof proto._initialize !== 'function' ||
          typeof module.initializeAuth !== 'function'
        ) {
          return module;
        }
        Object.defineProperty(proto, '_shouldInitProactively', {
          configurable: true,
          get: () => false,
        });
        const patched = Object.assign({}, module);
        patched.initializeAuth = function () {
          const instance = module.initializeAuth.apply(this, arguments);
          const started = instance && instance._initializationPromise;
          Promise.resolve(started)
            .catch(() => {})
            .then(() => {
              const helper = instance && instance._popupRedirectResolver;
              if (helper) return helper._initialize(instance);
            })
            .catch(() => {});
          return instance;
        };
        return patched;
      }

      // App Check's reCAPTCHA token gets 6 seconds. Firestore and Auth wait
      // for it whenever App Check runs, though neither enforces it, so a
      // stalled reCAPTCHA held up the database and sign-in for good
      // (7 November). Past the limit Firebase carries on with no token, which
      // only the Cloud Functions refuse; later asks fail at once until
      // reCAPTCHA answers.
      onModule('firebase_app_check', (module) => {
        const provider = module && module.ReCaptchaEnterpriseProvider;
        const proto = provider && provider.prototype;
        if (!proto || typeof proto.getToken !== 'function') return module;
        const getToken = proto.getToken;
        let stalled = false;
        proto.getToken = function () {
          if (stalled) {
            return Promise.reject(new Error('reCAPTCHA is not answering'));
          }
          const attempt = getToken.apply(this, arguments);
          return new Promise((resolve, reject) => {
            const timer = setTimeout(() => {
              stalled = true;
              const recover = () => {
                stalled = false;
              };
              attempt.then(recover, recover);
              reject(new Error('reCAPTCHA did not answer in 6 seconds'));
            }, 6000);
            attempt.then(
              (token) => {
                clearTimeout(timer);
                resolve(token);
              },
              (error) => {
                clearTimeout(timer);
                reject(error);
              },
            );
          });
        };
        return module;
      });
    })();
  </script>
  <!-- The camera page's back camera and barcodes; the barcode reader itself
       loads when first used. -->
  <script src="camera.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
