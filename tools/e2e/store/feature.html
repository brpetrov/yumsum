<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Fredoka; src: url("../../../assets/fonts/Fredoka-SemiBold.ttf"); }
@font-face { font-family: Nunito; src: url("../../../assets/fonts/Nunito-SemiBold.ttf"); }
html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
body { background: linear-gradient(120deg, #FFDCC2 0%, #FFF3E6 60%, #FBF0E4 100%); font-family: Nunito, sans-serif; color: #2B1F18; position: relative; }
.left { position: absolute; left: 72px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
.brand { display: flex; align-items: center; gap: 20px; }
.brand img { width: 96px; height: 96px; border-radius: 26px; box-shadow: 0 14px 30px rgba(201,77,26,.25); }
.brand span { font-family: Fredoka, sans-serif; font-size: 72px; letter-spacing: -1px; }
h1 { font-family: Fredoka, sans-serif; font-weight: 600; font-size: 40px; line-height: 1.15; margin: 34px 0 14px; }
p { font-size: 22px; color: #6F5F53; margin: 0; }
.phone { position: absolute; right: 70px; top: 46px; width: 300px; height: 533px; border-radius: 36px; overflow: hidden; border: 8px solid #2B1F18; box-shadow: 0 24px 50px rgba(43,31,24,.25); transform: rotate(4deg); background: #FBF0E4; }
.phone img { width: 100%; display: block; }
</style></head>
<body>
  <div class="left">
    <div class="brand"><img src="../../../assets/logo.png" alt=""><span>YumSum</span></div>
    <h1>Log a meal in seconds.<br>Stay on track every day.</h1>
    <p>Type it, say it, snap it or scan it.</p>
  </div>
  <div class="phone"><img src="en-1-home.png" alt=""></div>
</body></html>
