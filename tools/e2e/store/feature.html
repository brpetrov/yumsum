<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face { font-family: Fredoka; src: url("../../../assets/fonts/Fredoka-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: Nunito; src: url("../../../assets/fonts/Nunito-SemiBold.ttf"); font-weight: 600; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
body { background: #FAF2E7; color: #2B1F18; font-family: Nunito, sans-serif; font-weight: 600; position: relative; }
.wash { position: absolute; left: 500px; top: 60px; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(ellipse, #F6D6BD 0%, #FAF2E700 65%); }
.food { position: absolute; left: 550px; right: 0; top: 160px; bottom: 0; background: linear-gradient(#FAF2E7, #FAF2E700 50%), url('recipe-backdrop.png') center bottom / 560px auto; opacity: .76; filter: blur(2px); mask-image: linear-gradient(to right, transparent, black 30%); }
.copy { position: absolute; left: 60px; top: 54px; }
.brand { display: flex; align-items: center; gap: 16px; font: 600 52px Fredoka; }
.brand img { width: 72px; height: 72px; border-radius: 20px; }
h1 { margin: 31px 0 19px; font: 600 55px/1.08 Fredoka; letter-spacing: -.7px; }
h1 em { color: #C94D1A; font-style: normal; }
p { margin: 0; font-size: 25px; line-height: 1.5; color: #76665A; }
.fact { display: inline-block; margin-top: 24px; padding: 12px 20px; border-radius: 99px; background: #C94D1A; color: white; font-size: 22px; }
.phone { position: absolute; right: 58px; top: 38px; width: 300px; height: 485px; padding: 7px; border-radius: 36px; background: #2B211B; box-shadow: 0 22px 40px #4F2D1926; transform: rotate(3deg); }
.screen { border-radius: 29px; overflow: hidden; width: 100%; height: 100%; }
canvas { display: block; width: 100%; height: 100%; object-fit: cover; object-position: bottom; }
</style></head>
<body>
  <div class="wash"></div>
  <div class="food"></div>
  <div class="copy">
    <div class="brand"><img src="../../../assets/android/play_store_512.png" alt="YumSum icon"><span>YumSum</span></div>
    <h1>Log meals<br>in <em>seconds</em></h1>
    <p>Type it, say it, snap it or scan it.</p>
    <p class="fact">10 free estimates a day. No ads.</p>
  </div>
  <div class="phone"><div class="screen"><canvas id="capture"></canvas></div></div>
  <script>
    window.ready = (async () => {
      await document.fonts.ready;
      await Promise.all([...document.images].map(img => img.decode()));
      const img = new Image(); img.src = 'en-2-quick-log.png'; await img.decode();
      const canvas = document.getElementById('capture');
      canvas.width = 1080; canvas.height = 1759;
      canvas.getContext('2d').drawImage(img, 0, 160, 1080, 1759, 0, 0, 1080, 1759);
    })();
  </script>
</body></html>
