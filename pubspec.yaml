name: lean_streak
description: "LeanStreak - A low-friction habit and calorie consistency tracker"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  flutter_riverpod: ^2.6.1
  go_router: ^18.1.3
  intl: ^0.20.3
  flutter_local_notifications: ^23.0.0
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  shared_preferences: ^2.5.6
  quick_actions: ^1.1.1
  home_widget: ^0.10.0
  image_picker: ^1.2.4
  fl_chart: ^1.3.0
  record: ^7.1.2
  url_launcher: ^6.3.3
  google_sign_in: ^7.2.0
  firebase_app_check: ^0.5.1
  firebase_crashlytics: ^6.0.1
  http: ^1.6.0
  camera: ^0.12.2
  # The web's back camera is opened by its id (web_camera_web.dart), which
  # needs camera_web's own types; pinned, as one of them isn't exported.
  camera_platform_interface: ^2.15.0
  camera_web: 0.3.6
  google_mlkit_barcode_scanning: ^1.0.1
  cached_network_image: ^4.0.6
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5
  cloud_functions: ^7.0.1
  crypto: ^3.0.8
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo.png
    - assets/coach.webp
    - assets/smart_snap.webp
    - assets/fonts/OFL.txt
    - assets/fonts/OFL-Fredoka.txt
    - assets/recipes/recipes.json
    - assets/plus/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
    # Fredoka's Cyrillic stand-in (AppTheme.display). Only ExtraBold, so
    # every heading weight gets it: the engines pick by the file's own
    # weight, and Nunito Bold looks thin beside Fredoka SemiBold.
    - family: NunitoDisplay
      fonts:
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
