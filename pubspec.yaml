name: lean_streak
description: "LeanStreak - A low-friction habit and calorie consistency tracker"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.2
  intl: ^0.19.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  shared_preferences: ^2.5.3
  quick_actions: ^1.1.0
  home_widget: ^0.9.1
  image_picker: ^1.1.2
  fl_chart: ^1.2.0
  record: ^6.2.1
  url_launcher: ^6.3.3
  google_sign_in: ^7.2.0
  firebase_ai: ^2.3.0
  firebase_app_check: ^0.3.2
  firebase_crashlytics: ^4.3.10
  http: ^1.2.0
  camera: ^0.12.0+2
  google_mlkit_barcode_scanning: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/fonts/OFL.txt
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
